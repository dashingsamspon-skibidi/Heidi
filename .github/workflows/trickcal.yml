name: Heidi
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Naver: chỉ in ra, không gửi Discord, không ghi state"
        type: boolean
        default: false
      force_feed_id:
        description: "Naver: ép xử lý bài này (vd 8373557) để test giao diện"
        required: false
        default: ""

concurrency:
  group: heidi-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests feedparser
      - run: python bot.py
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

      - name: Naver lounge
        if: ${{ !cancelled() }}
        run: python naver.py
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          NAVER_DISCORD_WEBHOOK: ${{ secrets.NAVER_DISCORD_WEBHOOK }}
          NAVER_DRY_RUN: ${{ inputs.dry_run }}
          NAVER_FORCE_FEED_ID: ${{ inputs.force_feed_id }}

      - name: Save last_id
        if: ${{ !cancelled() }}
        run: |
          git config user.email "bot@bot.com"
          git config user.name "Bot"
          git add last_id.txt
          [ -f naver_state.json ] && git add naver_state.json || true
          git diff --staged --quiet || git commit -m "update last_id"
          git push
